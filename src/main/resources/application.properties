spring.application.name=demo

# MySQL Connection Configurations
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Use Default HikariCP Database Connection Pool (Spring Boot 3 default)
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20

# MyBatis-Plus Configurations
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Redis Configurations
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:0}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}
spring.data.redis.connect-timeout=${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}

# JWT Configurations
# The secret must be at least 256 bits (32 bytes) long for HS256
jwt.secret=${JWT_SECRET}
# Token expiration time in milliseconds (e.g., 24 hours = 86400000)
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google OAuth2 Configuration
google.client-id=${GOOGLE_CLIENT_ID}

# SMTP Configurations
spring.mail.host=${SPRING_MAIL_HOST:smtp.resend.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:resend}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${SPRING_MAIL_FROM}

# Verification code settings
verify.code.expire-minutes=${VERIFY_CODE_EXPIRE_MINUTES:5}
verify.code.resend-cooldown-seconds=${VERIFY_CODE_RESEND_COOLDOWN_SECONDS:60}
